<title>আমার হিসাব</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--g:#0a4d32;--g2:#14804f;--gold:#e9b949;--bg:#f1f5f2;--r:#d9455b;--mut:#74857b}
body{font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;background:radial-gradient(900px 400px at 100% -10%,#d6eadf,transparent),var(--bg);color:#14271e;padding-bottom:110px}
button,input,select{font:inherit;color:inherit}button{border:0;cursor:pointer}a{cursor:pointer}
.hd{position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;background:#0a4d32f2;backdrop-filter:blur(14px);color:#fff;box-shadow:0 4px 18px #0a4d3233}
.hd span{display:flex;gap:6px}.hd b{font-size:17px}.hd button{background:#ffffff22;color:#fff;padding:6px 13px;border-radius:20px;font-size:12px;border:1px solid #ffffff2e}
.ovc{margin:14px;padding:20px 18px;border-radius:26px;color:#fff;background:linear-gradient(145deg,#17935b 0%,#0a4d32 60%,#06301f);box-shadow:0 14px 30px #0a4d3240;position:relative;overflow:hidden}
.ovc:after{content:"";position:absolute;right:-50px;top:-60px;width:180px;height:180px;border-radius:50%;background:#ffffff12}
.ovc p{font-size:12px;opacity:.85;letter-spacing:.3px}.ovc h2{font-size:38px;color:var(--gold);margin:2px 0 14px;font-weight:800;line-height:1.15}
.two{display:flex;gap:10px;position:relative;z-index:1}.two>div{flex:1;background:#ffffff1c;border:1px solid #ffffff1f;border-radius:16px;padding:10px 12px;font-size:12px}.two b{display:block;font-size:16px;margin-top:2px}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:20px;padding:14px;color:#fff;box-shadow:0 8px 20px #0002}.mini p{font-size:12px;opacity:.9}.mini b{font-size:22px;display:block;margin-top:2px}
.dn{background:linear-gradient(145deg,#ef6a7e,#c0324a)}.pn{background:linear-gradient(145deg,#2fb87a,#0f7a4b)}
.card{background:#fff;border-radius:22px;padding:16px;margin:12px 14px;box-shadow:0 6px 22px #0a4d320f;border:1px solid #e8f0ec}
.card h3{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;background:#e0eae4;border-radius:16px;padding:4px;margin:12px 14px}
.seg button{flex:1;padding:9px;border-radius:12px;background:none;color:#4b6256;font-size:13px}
.seg button.on{background:#fff;color:var(--g);font-weight:700;box-shadow:0 3px 10px #0a4d3226}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef3f0}.row:last-child{border:0}
.row i{width:42px;height:42px;border-radius:15px;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;flex:none;box-shadow:0 4px 10px #0002}
.row>div{flex:1;min-width:0}.row small{display:block;color:var(--mut);font-size:12px}.g{color:var(--g2)}.r{color:var(--r)}
.ac{display:flex;gap:4px;margin-left:2px}.ac a{width:30px;height:30px;border-radius:10px;background:#eef4f0;display:grid;place-items:center;font-size:13px}
.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:#ffffffeb;backdrop-filter:blur(16px);border-radius:28px;display:flex;padding:6px;box-shadow:0 10px 30px #0a4d3233;border:1px solid #e3ede7;z-index:5}
.nav button{flex:1;background:none;padding:7px 0;border-radius:22px;font-size:11px;color:#5b6d63}.nav button span{display:block;font-size:20px}
.nav button.on{background:linear-gradient(145deg,#e3f5ea,#cfeedd);color:var(--g);font-weight:700}
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 92px);width:58px;height:58px;border-radius:20px;background:linear-gradient(145deg,#f4cb5c,#d9a02a);color:#3a2a00;font-size:32px;box-shadow:0 10px 24px #b8860b66;z-index:5}
.donut{display:flex;justify-content:center;position:relative;margin-bottom:8px}.donut div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--mut)}.donut b{font-size:19px;color:#14271e}
.inp{width:100%;padding:13px 14px;border:1.5px solid #dbe6e0;border-radius:15px;background:#f7faf8;margin-bottom:10px;outline:0}.inp:focus{border-color:var(--g2);background:#fff}
.btn{width:100%;padding:14px;border-radius:16px;background:linear-gradient(145deg,#17935b,#0a4d32);color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 18px #0a4d3230}
.btn.s{width:auto;padding:9px 16px;font-size:14px}.btn.gh{background:#e8efeb;color:#33463c;box-shadow:none}.btn.gd{background:linear-gradient(145deg,#f4cb5c,#d9a02a);color:#3a2a00}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.chips button{padding:8px 14px;border-radius:14px;background:#edf3ef;font-size:14px}.chips button.on{background:var(--g);color:#fff}
#dl,#cf{position:fixed;inset:0;display:none;place-items:center;padding:16px}#dl{z-index:20}#cf{z-index:30}#dl.on,#cf.on{display:grid}
.bk{position:absolute;inset:0;background:#04201499;backdrop-filter:blur(5px)}
.dlg{position:relative;width:min(92vw,410px);max-height:86vh;overflow:auto;background:#fff;border-radius:28px;padding:20px;box-shadow:0 24px 60px #0006;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.dlg h3{margin-bottom:14px;display:flex;justify-content:space-between;font-size:17px}.fl{display:block;font-size:12px;color:var(--mut);margin:0 0 5px 3px}
.toast{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#14271ef2;color:#fff;padding:13px 22px;border-radius:18px;z-index:40;animation:pop .2s;box-shadow:0 12px 30px #0005;font-size:14px}
.bar{height:9px;border-radius:6px;background:#e6eee9;margin-top:6px;overflow:hidden}.bar u{display:block;height:100%;border-radius:6px}
.mr{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #eef3f0;gap:8px}.mr>span{flex:1;font-size:13px}
.stp{display:flex;align-items:center;background:#edf3ef;border-radius:14px;overflow:hidden}.stp button{width:30px;height:34px;background:none;font-size:18px;color:var(--g)}.stp b{min-width:36px;text-align:center;font-size:14px;padding:6px 0}.stp b.on{background:var(--g2);color:#fff}
.yb{display:flex;align-items:flex-end;gap:5px;height:110px}.yb div{flex:1;display:flex;align-items:flex-end;gap:1px;height:100%}.yb u{flex:1;border-radius:3px 3px 0 0}
.ar{display:flex;font-size:10px;color:var(--mut);margin-top:4px}.ar span{flex:1;text-align:center}
.lock{position:fixed;inset:0;background:linear-gradient(160deg,#17935b,#06301f);z-index:50;display:none;place-content:center;text-align:center;color:#fff;gap:14px}.lock.on{display:grid}
.lock input{text-align:center;font-size:28px;letter-spacing:10px;width:200px;padding:10px;border-radius:16px;border:0}
.tg{display:flex;gap:6px;background:#edf3ef;border-radius:15px;padding:4px;margin-bottom:12px}.tg button{flex:1;padding:10px;border-radius:12px;background:none}.tg button.on{background:var(--g);color:#fff}
.hint{font-size:12px;color:var(--mut);margin:-4px 0 10px}.big{font-size:22px;font-weight:700}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 14px}.tl button{background:#fff;border-radius:22px;padding:18px 12px;text-align:center;box-shadow:0 6px 20px #0a4d3214;border:1px solid #e8f0ec;font-size:14px;font-weight:600}.tl span{display:block;font-size:30px;margin-bottom:6px}

.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.hd b{display:flex;align-items:center;gap:9px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,#8cf0b2,#2fb36d);color:#06301d;box-shadow:0 4px 12px #0004}.logo .ic{width:19px;height:19px}
.hd button{display:inline-flex;align-items:center;gap:6px}
.nav button .ic{width:23px;height:23px}.nav button span{display:flex;justify-content:center;margin-bottom:2px}
.tl .ic{width:32px;height:32px;color:var(--g2)}.tl span{display:flex;justify-content:center}
.ac .ic{width:16px;height:16px}.fab{display:grid;place-items:center}.fab .ic{width:28px;height:28px;stroke-width:2.6}
.btn{display:flex;align-items:center;justify-content:center;gap:8px}
.row i{border-radius:50%;font-size:18px}.row i .ic{width:20px;height:20px}
.cfi{width:56px;height:56px;border-radius:50%;background:#fde8e8;color:#b73b3b;display:grid;place-items:center;margin:0 auto 10px}.cfi .ic{width:28px;height:28px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chips button{text-align:left;padding:10px 12px;border-radius:14px;border:1px solid #e0eae4;background:#fbfdfb}.chips button.on{border-color:var(--g)}
.ovc:before{content:"";position:absolute;left:-40px;bottom:-70px;width:150px;height:150px;border-radius:50%;background:#ffffff0d}
@media print{.hd,.nav,.fab,.seg,.btn{display:none!important}body{background:#fff;padding:0}.card,.ovc{box-shadow:none;break-inside:avoid}}
</style></head><body>

 id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol><symbol id="i-pie" viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></symbol><symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></symbol></defs></svg>
<div id="app"></div>
<button class="fab" onclick="openTx()" aria-label="যোগ"><svg class="ic"><use href="#i-plus"/></svg></button>
<div class="nav" id="nav"></div><div id="dl"></div><div id="cf"></div>
<div class="lock" id="lock"><h1>🔒 আমার হিসাব</h1><p>পিন দিন</p><input id="lp" type="password" inputmode="numeric" maxlength="6" oninput="chkPin()"></div>
<script>
const $=s=>document.querySelector(s),K='amar-hishab-v1',pad=n=>String(n).padStart(2,'0'),J=JSON.stringify;
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
let S={tx:[],acc:[],meals:{},rt:{},debt:[],bud:[],sav:[],cats:['বাসা ভাড়া','গাড়ি ভাড়া','খাবার খরচ','নাস্তা খরচ','অন্যান্য খরচ'],icats:['বেতন','ব্যবসা','অন্যান্য আয়'],pin:''};
const DEF=JSON.parse(JSON.stringify(S));
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!S.v2){['বাজার','যাতায়াত','বিদ্যুৎ/গ্যাস/পানি','মোবাইল/ইন্টারনেট','চিকিৎসা','পড়াশোনা','পরিবার','বিনোদন','কেনাকাটা'].forEach(c=>{if(!S.cats.includes(c))S.cats.push(c)});['ফ্রিল্যান্স','উপহার'].forEach(c=>{if(!S.icats.includes(c))S.icats.push(c)});S.v2=1;localStorage.setItem(K,JSON.stringify(S))}
const save=()=>localStorage.setItem(K,J(S)),uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const bn=n=>Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:2}),tk=n=>'৳'+bn(n);
const ds=d=>(d=d||new Date(),d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()));
const bd=d=>new Date(d+'T00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'short'});
const MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const COL=['#0d8f5f','#e9a800','#d9455b','#3b82f6','#8b5cf6','#f97316','#14b8a6','#ec4899','#84cc16','#64748b'];
const CAT={"খাবার":["🍽️","#e8590c"],"বাজার":["🛒","#2f9e44"],"যাতায়াত":["🚌","#1c7ed6"],"বাসা ভাড়া":["🏠","#f59f00"],"বিদ্যুৎ/গ্যাস/পানি":["💡","#e0a800"],"মোবাইল/ইন্টারনেট":["📶","#7048e8"],"চিকিৎসা":["💊","#e03131"],"পড়াশোনা":["🎓","#1971c2"],"পরিবার":["👨‍👩‍👧","#d6336c"],"বিনোদন":["🎬","#ae3ec9"],"কেনাকাটা":["🛍️","#0ca678"],"অন্যান্য":["📦","#868e96"],"বেতন":["💼","#2b8a3e"],"ব্যবসা":["🏪","#e67700"],"ফ্রিল্যান্স":["💻","#1864ab"],"উপহার":["🎁","#c2255c"],"অন্যান্য আয়":["➕","#5f3dc4"],"গাড়ি ভাড়া":["🚗","#1c7ed6"],"খাবার খরচ":["🍽️","#e8590c"],"নাস্তা খরচ":["🥪","#f59f00"],"অন্যান্য খরচ":["📦","#868e96"]},ci=c=>CAT[c]?CAT[c][0]:c[0];
const colr=s=>CAT[s]?CAT[s][1]:COL[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
let tab='home',per='m',mo=new Date(),ft='e',sc=0,dp=null;
const NAV=[['home','home','হোম'],['tx','list','লেনদেন'],['meal','meal','মিল'],['acc','bank','ব্যাংক'],['more','more','আরও']],SUB={debt:1,bud:1,sav:1,rep:1,cat:1,bk:1};
$('#nav').innerHTML=NAV.map(n=>`<button data-t="${n[0]}" onclick="go('${n[0]}')"><span>${ic(n[1])}</span>${n[2]}</button>`).join('');
const go=t=>{tab=t;view()};
const tot=()=>S.acc.reduce((a,x)=>a+x.b,0),sum=(l,t)=>l.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
const rem=d=>d.a-(d.paid||0),dsum=w=>S.debt.filter(d=>d.w==w).reduce((a,d)=>a+rem(d),0);
function range(){const n=new Date();let a,b;
 if(per=='w'){a=new Date(n);a.setDate(n.getDate()-((n.getDay()+1)%7));b=new Date(a);b.setDate(a.getDate()+6)}
 else if(per=='m'){a=new Date(n.getFullYear(),n.getMonth(),1);b=new Date(n.getFullYear(),n.getMonth()+1,0)}
 else{a=new Date(n.getFullYear(),0,1);b=new Date(n.getFullYear(),11,31)}return[ds(a),ds(b)]}
const inP=()=>{const[a,b]=range();return S.tx.filter(t=>t.d>=a&&t.d<=b)};
const seg=()=>`<div class="seg">${[['w','সাপ্তাহিক'],['m','মাসিক'],['y','বার্ষিক']].map(k=>`<button class="${per==k[0]?'on':''}" onclick="per='${k[0]}';view()">${k[1]}</button>`).join('')}</div>`;
const isInst=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const hd=()=>`<div class="hd"><b><span class="logo">${ic('leaf')}</span>আমার হিসাব</b><span>${isInst()?'':`<button onclick="inst()">${ic('down')} ইনস্টল</button>`}<button onclick="go('bk')">${ic('up')} ব্যাকআপ</button></span></div>`;
const ov=(l,big,it)=>`<div class="ovc"><p>${l}</p><h2>${big}</h2><div class="two">${it.map(i=>`<div>${i[0]}<b>${i[1]}</b></div>`).join('')}</div></div>`;
const J2=(k,id,x='')=>`<span class="ac">${x}<a onclick='ed("${k}",${J(id)})'>${ic('edit')}</a><a onclick='rm("${k}",${J(id)})'>${ic('trash')}</a></span>`;
const accN=id=>(S.acc.find(a=>a.id==id)||{}).n;
const txRow=t=>{const tr=t.t=='t';return `<div class="row"><i style="background:${tr?'#64748b':colr(t.c)}">${tr?ic('swap'):ci(t.c)}</i><div><b>${t.c}</b><small>${bd(t.d)}${tr?' • '+accN(t.ac)+' → '+accN(t.to):accN(t.ac)?' • '+accN(t.ac):''}${t.n?' • '+t.n:''}</small></div><b class="${tr?'':t.t=='i'?'g':'r'}">${tr?'⇄ ':t.t=='i'?'+':'-'}${tk(t.a)}</b>${J2('tx',t.id)}</div>`};
function bycat(l){const m={};l.filter(x=>x.t=='e').forEach(x=>m[x.c]=(m[x.c]||0)+x.a);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function donut(items,t){const r=70,C=2*Math.PI*r;let o=0;
